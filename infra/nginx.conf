worker_processes 1;
pid logs/nginx.pid;
error_log logs/error.log;

events {
    worker_connections 256;
}

http {
    include C:/tools/nginx-1.30.6/conf/mime.types;
    default_type application/octet-stream;
    access_log logs/access.log;
    sendfile on;
    keepalive_timeout 65;

    server {
        listen 127.0.0.1:80;
        server_name markethub.test;
        root D:/Projects/markethub/public;
        index index.php;
        charset utf-8;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location = /index.php {
            include C:/tools/nginx-1.30.6/conf/fastcgi_params;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param HTTP_PROXY "";
        }

        location ~ \.php$ {
            return 404;
        }

        location ~ /\. {
            deny all;
        }
    }
}

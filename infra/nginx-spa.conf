# Alternative complete configuration. Existing nginx.conf stays unchanged.
worker_processes 1;
pid logs/nginx.pid;
error_log logs/error.log;
events { worker_connections 256; }
http {
    include C:/tools/nginx-1.30.6/conf/mime.types;
    default_type application/octet-stream;
    access_log logs/access.log;
    sendfile on;
    keepalive_timeout 65;
    server {
        listen 127.0.0.1:80;
        server_name markethub.test;
        root D:/Projects/markethub/frontend/dist;
        index index.html;
        charset utf-8;

        location / { try_files $uri $uri/ /index.html; }
        location = /index.html { add_header Cache-Control "no-cache"; }
        location /assets/ { try_files $uri =404; expires 1y; add_header Cache-Control "public, immutable"; }

        location = /api { rewrite ^ /index.php last; }
        location ^~ /api/ { rewrite ^ /index.php last; }
        location = /sanctum { rewrite ^ /index.php last; }
        location ^~ /sanctum/ { rewrite ^ /index.php last; }
        location = /up { rewrite ^ /index.php last; }
        location = /index.php {
            internal;
            include C:/tools/nginx-1.30.6/conf/fastcgi_params;
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_param SCRIPT_FILENAME D:/Projects/markethub/public/index.php;
            fastcgi_param DOCUMENT_ROOT D:/Projects/markethub/public;
            fastcgi_param HTTP_PROXY "";
        }
        location ~ \.php$ { return 404; }
        location ~ /\. { deny all; }
    }
}

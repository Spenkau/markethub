# /etc/nginx/sites-available/markethub; replace example.invalid and certificate paths.
server {
    listen 80;
    server_name example.invalid;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name example.invalid;
    ssl_certificate /etc/letsencrypt/live/example.invalid/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.invalid/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /srv/markethub/current/frontend/dist;
    index index.html;
    charset utf-8;
    client_max_body_size 20m;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options SAMEORIGIN always;
    location / { try_files $uri $uri/ /index.html; }
    location = /index.html { add_header Cache-Control no-cache; }
    location /assets/ { try_files $uri =404; expires 1y; add_header Cache-Control "public, immutable"; }
    location = /api { rewrite ^ /index.php last; }
    location ^~ /api/ { rewrite ^ /index.php last; }
    location ^~ /sanctum/ { rewrite ^ /index.php last; }
    location = /up { rewrite ^ /index.php last; }
    location = /index.php {
        internal;
        include fastcgi_params;
        fastcgi_pass unix:/run/php/markethub.sock;
        fastcgi_param SCRIPT_FILENAME /srv/markethub/current/public/index.php;
        fastcgi_param DOCUMENT_ROOT /srv/markethub/current/public;
        fastcgi_param HTTPS on;
        fastcgi_param HTTP_PROXY "";
    }
    location ~ \.php$ { return 404; }
    location ~ /\. { deny all; }
}

; Include in the installed PHP-FPM pool directory. Disable the unused default pool.
[markethub]
user = markethub
group = markethub
listen = /run/php/markethub.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660
pm = dynamic
pm.max_children = 8
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
chdir = /srv/markethub/current
clear_env = yes
catch_workers_output = yes
php_admin_value[error_log] = /srv/markethub/shared/storage/logs/php-fpm.log
php_admin_flag[log_errors] = on
php_admin_flag[display_errors] = off
